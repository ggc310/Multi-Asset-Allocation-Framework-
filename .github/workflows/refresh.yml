name: Refresh and publish dashboard

on:
  schedule:
    # Full refresh (prices, history, curve) before the open and after the close.
    # 13:02 UTC is 9:02am ET in daylight time / 8:02am in standard time;
    # 21:22 UTC is after the 4pm ET close in both.
    - cron: '2 13 * * 1-5'
    - cron: '22 21 * * 1-5'
    # Fast refresh (quotes, headlines, calendars) every 5 minutes in between.
    # GitHub may start scheduled runs late or skip some when it is busy.
    - cron: '*/5 13-21 * * 1-5'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Refresh live market data from FMP
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          MODE: ${{ github.event.schedule == '*/5 13-21 * * 1-5' && 'fast' || 'full' }}
          PREV_SITE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: node refresh/refresh.mjs
      - name: Build page
        run: node tools/build.mjs
      - name: Stage site
        run: |
          mkdir -p _site
          cp -r index.html assets page data _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
